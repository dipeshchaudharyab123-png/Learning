<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Assignment</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
}

/* Header */
header{
    text-align: center;
    background-color: rgb(83, 83, 255);
    padding: 20px;
    color: white;
}

/* Menu */
.menu {
    display: flex;              
    justify-content: space-around;
    list-style: none;
    padding: 10px 0;
    margin:0;
}

.menu li {
    padding: 10px 20px;
    background: #00aa77;
    color: white;
    text-align: center;
    transition: 0.3s;
}

.menu li:hover {
    background: #008855;   /* subtle hover effect */
    cursor: pointer;
}

/* Card */
.card {
    background: #87CEFA;  /* softer color */
    padding: 20px;
    margin: 20px auto;
    width: 50%;                
    text-align: center;
}

/* Responsive Media Query */
@media (max-width: 600px) {
    header {
        padding: 15px;
        font-size: 18px;
    }

   
</style>
</head>
<body>

<header>CSS Responsive</header>

<ul class="menu">
    <li>Home</li>
    <li>About</li>
    <li>Services</li>
    <li>Contact</li>
</ul>

<div class="card">This is a responsive card!</div>

</body>
</html>
