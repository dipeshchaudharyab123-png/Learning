<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border: 2px solid black;
            height: 100px;
            width: 300px;
            padding: 10px 10px 10px 10px;
            margin:20px 20px 20px 20px;
            max-width: 50%;
            text-align: center;
            border-radius: 10px;
            background-color: yellow;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            align-self: center;
        }
        .card h2{
            color: rgb(255, 255, 255);background-color: rgb(222, 80, 250);
            border-radius: 10px;
            width: 180px;
            text-align: center;
            align-self: center;
            margin-left: 35px;
        }
        .card p{
            color: blue;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="card">
  <h2>My Card Title</h2>
  <p>This is simple card design using CSS.</p>
</div>

</body>
</html>
