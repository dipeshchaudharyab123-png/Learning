<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*This is example of class selector*/
        #a
        {
            background-color: black;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="Day 7.css">
</head>
<body>
    <h1 class="a">This is example of class selector and CSS code is External CSS.</h1>
    <h1 id="a">This is example of id selector and CSS code is Head section (Internal CSS).</h1>
    <h1 style="background-color: red;color: yellow;">This is example of inline CSS.</h1>
</body>
</html>
