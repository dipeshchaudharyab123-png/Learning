<!DOCTYPE html>
<html>
<head>
  <title>Display Example</title>
  <style>
    .menua a {
      display: block;
      width: 50px;
      height: 30x;
      padding: 5px;
      text-align: center;
      background-color: rgb(234, 255, 113);
      border: 1px solid black;
      text-decoration: none;
      margin: 10px;
      border-radius: 10px;
    }

    .menua a:hover {
      background-color: rgb(255, 19, 19);
    }
    .menub a {
      display: inline;
      width: 50px;
      height: 30x;
      padding: 5px;
      text-align: center;
      background-color: rgb(234, 255, 113);
      border: 1px solid black;
      text-decoration: none;
      margin: 10px;
      border-radius: 10px;
    }

    .menub a:hover {
      background-color: rgb(255, 19, 19);
    }
    .menuc a {
      display: inline-block;
      width: 50px;
      height: 30x;
      padding: 5px;
      text-align: center;
      background-color: rgb(234, 255, 113);
      border: 1px solid black;
      text-decoration: none;
      margin: 10px;
      border-radius: 10px;
    }

    .menu a:hover {
      background-color: rgb(255, 19, 19);
    }
  </style>
</head>
<body>

  <div class="menua">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  <div class="menub">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  <div class="menuc">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>

</body>
</html>
