<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <section>
            <fieldset>
                <legend><h2>Contact foam</h2></legend>
                <foam>
                    <label>Name:</label>
                    <input type="text" placeholder="Enter your name"><br><br>
                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email"><br><br>
                    <label>Password:</label>
                    <input type="password" placeholder="Enter your email password"><br><br>
                    <label>gender:</label>
                    <input type="radio" name="Gender">Male
                    <input type="radio" name="Gender">Female
                    <input type="radio" name="Gender">Not specified<br>
                    <label>Hobbies:</label>
                    <input type="checkbox">Coder
                    <input type="checkbox">Designer
                    <input type="checkbox">Developer
                    <input type="checkbox">Editor
                    <br><br>
                    <label>Message:</label><br>
                    <textarea rows="4" cols="30"></textarea><br><br>
                    <button type="submit">Send Message</button>
                    <button type="reset">Reset</button>
                </foam>
            </fieldset>
        </section>
</body>
</html>
