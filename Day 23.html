<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.a{
   display: flex;
   justify-content: center;   /* horizontal center */
   align-items: center;       /* vertical center */
   background-color: rgb(255, 255, 12); 
   height:100vh;
}

.b{
    background-color: red;
    height: 150px;
    width: 200px;
    padding: 10px; 
    color: white; 
    border-radius: 10px; 
}
</style> 
</head>
<body>
    <div class="a">
      <div class="b">
        <h1>CSS Learning</h1>
        <p>This is easy.</p>
        <button>Wow</button>
      </div>
    </div>
</body>
</html>
