!<!DOCTYPE html>
<html>
<head>
  <title>Float Example</title>
  <style>
    .image1 {
      float: right;
      width: 150px;
      height: 123px;
      background: blue;
      margin-right: 15px;
    }
    .image2 {
      float: left;
      width: 150px;
      height: 150px;
      background: blue;
      margin-right: 15px;
    }

  </style>
</head>
<body>

  <div class="image1"></div>

  <p>
    This text will wrap around the blue box.<br>
    Float makes elements move left or right,<br>
    and text flows around it like a newspaper.
  </p><br><br><br><BR><br>

<div class="image2"></div>

  <p>
    This text will wrap around the blue box.<br>
    Float makes elements move left or right,<br>
    and text flows around it like a newspaper.
  </p>
</body>
</html><br><br><br><br>

<!DOCTYPE html>
<html>
<head>
  <title>Float and Clear</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      float: left;
      margin: 10px;
    }

    .red { background: red; }
    .blue { background: blue; }

    .clear-box {
      clear: both;
      background: green;
      height: 100px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="box red"></div>
  <div class="box blue"></div>

  <div class="clear-box"></div>

</body>
</html>
