<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #CSS{
            background-color: blue;
            color: red;
            text-align: center;
        }
        .CSS
        {
            background-color: rgb(5, 209, 5);
            color: yellow;
            text-align: center;
        }
        h2
        {
            color: blue;
            background-color: yellow;
            text-align: center;
        }
        p{
            background-color: red;
            color: rgb(43, 0, 255);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="CSS">This is example of id selector to select id use hash (#). </h1>
    <h1 class="CSS">This is example of class selector to select class use dot (.).</h1>
    <h2>This is example of h1-h6 selector and select using name.</h2>
    <p>This is example of paragraph (p) selector and select using name.</p>
</body>
</html>
