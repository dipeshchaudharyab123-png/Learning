<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    html{
        font-size: 20px;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
        .px-box{
            width: 200px;
            background-color: chartreuse;
        }
        .percent-box{
            width: 50%;
            background-color: aqua;
        }
        .em-text{
        margin: 5px;
        font-size: 2em;
        }
        .rem-text{
            margin: 5px;
            font-size: 2rem;
        }
        .vh-box{
            background-color: bisque;
            height: 5vh ;
        }
</style>
<body>
     <div class="px-box">200px width</div>

  <div class="percent-box">50% width</div>

  <p class="em-text">This is 2em text</p>

  <p class="rem-text">This is 2rem text</p>

  <div class="vh-box">5vh height</div>
</body>
</html>
