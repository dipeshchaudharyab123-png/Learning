<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        .container{

    display: flex;

    gap: 30px;
    padding: 30px;
}

.card{

    height: 200px;
    background-color: blue; 
    color: white;  
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
}
    </style>
</head>
<body>

      </div>

</body>
</html>
