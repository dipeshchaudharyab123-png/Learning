<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 120px;
            width: 120px;
            border: 2px black;
            position: absolute;
            display: flex;
            align-items: center;
            color: white;
            font-size: 20px;
            justify-content: center;
        }
        .red{
            background: red;
            top: 50px;
            left: 50px;
            z-index: 1;
        }
        .blue{
            background: blue;
            top:100px;
            left: 100px;
            z-index: 2;
        }
        .yellow{
            background: rgb(216, 216, 39);
            top: 150px;
            left: 150px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="box red">Red</div>
    <div class="box blue">Blue</div>
    <div class="box yellow">Yellow</div>
</body>
</html>
